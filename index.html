<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧿 QUECKSILBER · 756 ACHSEN · 6D · FLUID</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Consolas', monospace;
      padding: 12px;
      background: radial-gradient(ellipse at 20% 30%, #1a1a24, #000000);
      color: #c0d0d0;
    }

    .container {
      max-width: 1400px;
      width: 100%;
      background: rgba(12, 12, 20, 0.5);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      padding: 20px 24px 30px;
      border: 1px solid rgba(180, 200, 220, 0.08);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), inset 0 0 60px rgba(200, 220, 240, 0.02);
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(180, 200, 220, 0.06);
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: 6px;
      background: linear-gradient(135deg, #e0e8f0, #b0c8d8, #8098b0, #c0d8e8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(160, 200, 240, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header h1 small {
      font-size: 12px;
      letter-spacing: 3px;
      background: none;
      -webkit-text-fill-color: #4a5a6a;
      color: #4a5a6a;
    }

    .status-badge {
      display: flex;
      gap: 18px;
      font-size: 11px;
      color: #5a7a8a;
      letter-spacing: 1px;
    }
    .status-badge span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2a4a5a;
      transition: 0.3s;
    }
    .dot.on {
      background: #8cf0d0;
      box-shadow: 0 0 12px #8cf0d0;
    }
    .dot.pulse {
      background: #f0d080;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* HAUPTGRID */
    .grid-wrap {
      position: relative;
      margin: 10px 0 18px;
      border-radius: 20px;
      background: rgba(6, 8, 14, 0.6);
      padding: 12px;
      border: 1px solid rgba(120, 160, 190, 0.04);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.7);
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(27, 1fr);
      grid-template-rows: repeat(28, 1fr);
      gap: 2px;
      aspect-ratio: 27 / 28;
      width: 100%;
      max-height: 70vh;
    }

    .cell {
      background: rgba(24, 32, 40, 0.25);
      border-radius: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: #8a9aaa;
      transition: all 0.25s cubic-bezier(0.15, 0.8, 0.3, 1.2);
      cursor: pointer;
      text-shadow: 0 0 6px rgba(160, 200, 240, 0.1);
      border: 1px solid rgba(100, 140, 170, 0.03);
      backdrop-filter: blur(1px);
      will-change: transform, background, box-shadow;
    }

    .cell:hover {
      z-index: 10;
      border-color: rgba(200, 230, 255, 0.15);
    }

    .cell.quicksilver {
      background: radial-gradient(circle at 30% 30%, #d8e8f0, #a0b8c8);
      color: #0a1218;
      border-color: #b0d0e0;
      box-shadow: 0 0 20px rgba(180, 220, 255, 0.3), inset 0 -4px 8px rgba(0,0,0,0.2);
      transform: scale(1.05);
      font-weight: bold;
    }

    .cell.wave {
      animation: waveGlow 1.8s ease-in-out infinite alternate;
    }

    @keyframes waveGlow {
      0% { box-shadow: 0 0 4px rgba(160, 200, 240, 0.1); background: rgba(24, 32, 40, 0.2); }
      100% { box-shadow: 0 0 24px rgba(180, 220, 255, 0.25); background: rgba(60, 80, 100, 0.3); }
    }

    /* KONTROLLLEISTE */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      margin: 8px 0 6px;
      padding: 6px 4px;
      border-top: 1px solid rgba(100, 140, 170, 0.04);
    }

    .controls button {
      background: rgba(20, 28, 36, 0.5);
      border: 1px solid rgba(120, 160, 190, 0.08);
      color: #9ab0c0;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 1.2px;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .controls button:hover {
      background: rgba(40, 70, 90, 0.3);
      border-color: rgba(160, 200, 240, 0.2);
      color: #d0e8f8;
      transform: translateY(-1px);
    }
    .controls button.primary {
      border-color: rgba(180, 220, 255, 0.15);
      color: #c0dce8;
    }
    .controls button.primary:hover {
      background: rgba(60, 120, 160, 0.2);
      border-color: #80c0e0;
      box-shadow: 0 0 20px rgba(80, 180, 240, 0.05);
    }
    .controls button.ds9 {
      border-color: rgba(255, 215, 0, 0.1);
      color: #e8d080;
    }
    .controls button.ds9:hover {
      background: rgba(255, 215, 0, 0.05);
      border-color: #f0d080;
    }
    .controls button.achse {
      border-color: rgba(0, 204, 255, 0.1);
      color: #70c8ff;
    }
    .controls button.achse:hover {
      background: rgba(0, 204, 255, 0.04);
    }
    .controls button.danger {
      border-color: rgba(255, 80, 80, 0.08);
      color: #d06060;
    }
    .controls button.danger:hover {
      background: rgba(255, 80, 80, 0.04);
    }

    .info-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      font-size: 11px;
      color: #4a6a7a;
      padding: 4px 0;
      border-top: 1px solid rgba(100, 140, 170, 0.03);
      margin-top: 4px;
    }
    .info-row .val {
      color: #aac8d8;
      font-weight: 400;
    }
    .info-row .highlight {
      color: #e8d080;
    }

    .log {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 14px;
      padding: 6px 14px;
      font-size: 10px;
      color: #4a6a7a;
      max-height: 50px;
      overflow-y: auto;
      border: 1px solid rgba(100, 140, 170, 0.02);
      margin-top: 8px;
      font-family: 'Consolas', monospace;
      line-height: 1.6;
    }
    .log .ok { color: #80d0b0; }
    .log .flow { color: #d0b080; }
    .log .whirl { color: #c080d0; }
    .log .ds9 { color: #e8d080; }
    .log .achse { color: #70c8ff; }
    .log .6d { color: #80d0b0; }

    .footer {
      text-align: center;
      margin-top: 12px;
      color: #1a2a30;
      font-size: 9px;
      letter-spacing: 3px;
    }
    .footer .gold { color: #e8d080; }
    .footer .silver { color: #b0c8d8; }

    @media (max-width: 700px) {
      .container { padding: 12px; }
      .header h1 { font-size: 18px; letter-spacing: 3px; }
      .cell { font-size: 8px; }
      .controls button { font-size: 10px; padding: 4px 12px; }
      .status-badge { font-size: 9px; gap: 10px; }
    }
  </style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>
      🧿 QUECKSILBER
      <small>756 ACHSEN · 6D</small>
    </h1>
    <div class="status-badge">
      <span><span class="dot on" id="dot6d"></span> 6D</span>
      <span><span class="dot" id="dotDs9"></span> DS9</span>
      <span><span class="dot on" id="dotFluid"></span> FLUID</span>
      <span><span class="dot pulse" id="dotAchse"></span> 756</span>
    </div>
  </div>

  <div class="grid-wrap">
    <div id="grid"></div>
  </div>

  <div class="controls">
    <button class="primary" id="btn6d">🌀 6D STEP</button>
    <button class="ds9" id="btnDs9">★ DS9</button>
    <button class="achse" id="btnAchse">📐 756 ACHSEN</button>
    <button id="btnFluid">💧 FLUID WAVE</button>
    <button id="btnQuake">⚡ QUAKE</button>
    <button class="danger" id="btnReset">⟲ RESET</button>
  </div>

  <div class="info-row">
    <span>SCORE: <span class="val" id="scoreDisplay">0</span></span>
    <span>ENGINE: <span class="val" id="engineDisplay">0</span></span>
    <span>INDUSTRY: <span class="val" id="industryDisplay">0</span></span>
    <span>MARKT: <span class="val" id="marktDisplay">0</span></span>
    <span class="highlight">⚡ <span id="comboDisplay">COMBO 0</span></span>
  </div>

  <div class="log" id="log">
    [🧿] Quecksilber · 756 Achsen · 6D · bereit
  </div>

  <div class="footer">
    <span class="gold">★</span> IMPERIUM · 756 ACHSEN · 6D · <span class="silver">flüssig wie Quecksilber</span>
  </div>
</div>

<script>
  // =============================================================
  //  QUEcksilber · 756 ACHSEN · 6D · FLUID ENGINE
  // =============================================================

  // ─── SYMBOLE ──────────────────────────────────────────────────
  const symbols = [
    "▲","▼","◄","►","◆","◇","○","●","■","□","✦","✧","✪","✫","✬","✭","✮","✯",
    "☀","☾","⊕","⚑","⚐","⚙","✹","✸","✶","✷","✳","✴","✱","✲","✢","✣","✤","✥",
    "✦","✧","✩","✪","✫","✬","✭","✮","✯","✰","✱","✲","✳","✴","✵","✶","✷","✸",
    "✹","✺","✻","✼","✽","✾","✿","❀","❁","❂","❃","❄","❅","❆","❇","❈","❉","❊"
  ];

  const gridEl = document.getElementById('grid');
  const cells = [];
  const COLS = 27;
  const ROWS = 28;
  const TOTAL = COLS * ROWS; // 756

  // ─── STATE ────────────────────────────────────────────────────
  const state = {
    score: 0,
    engine: 0,
    industry: 0,
    markt: 0,
    combo: 0,
    fluid: false,
    ds9: false,
    sixD: false,
    achsen: 756,
    cycle: 0
  };

  // ─── GRID AUFBAUEN ──────────────────────────────────────────
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.textContent = symbols[i % symbols.length];
    cell.dataset.index = i;

    // Klick: Quecksilber‑Effekt
    cell.addEventListener('click', () => {
      // metallischer Glanz
      cell.classList.add('quicksilver');
      setTimeout(() => cell.classList.remove('quicksilver'), 400);

      // Zufallsdrehung + Skalierung
      const deg = Math.floor(Math.random() * 720) - 360;
      const scale = 1.1 + Math.random() * 0.4;
      cell.style.transform = `rotate(${deg}deg) scale(${scale})`;
      cell.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.3)';
      setTimeout(() => {
        cell.style.transform = 'scale(1) rotate(0deg)';
      }, 300);

      // Punkt + Sound (simuliert)
      updateScore(1);
      playTone(600 + Math.random() * 200, 0.08);

      // Wenn DS9 aktiv, extra Glanz
      if (state.ds9) {
        cell.style.boxShadow = '0 0 40px rgba(255,215,0,0.6)';
        setTimeout(() => cell.style.boxShadow = '', 200);
      }
    });

    gridEl.appendChild(cell);
    cells.push(cell);
  }

  // ─── SCORE & COMBO ──────────────────────────────────────────
  let comboCount = 0;
  let comboTimer = null;

  function updateScore(v = 1) {
    state.score += v;
    document.getElementById('scoreDisplay').textContent = state.score;

    // Combo
    comboCount++;
    if (comboCount >= 3) {
      const bonus = 10;
      state.score += bonus;
      document.getElementById('scoreDisplay').textContent = state.score;
      document.getElementById('comboDisplay').textContent = `COMBO +${bonus}`;
      document.getElementById('comboDisplay').style.color = '#f0d080';
      setTimeout(() => {
        document.getElementById('comboDisplay').style.color = '';
      }, 600);
      comboCount = 0;
    } else {
      document.getElementById('comboDisplay').textContent = `COMBO ${comboCount}`;
    }

    clearTimeout(comboTimer);
    comboTimer = setTimeout(() => {
      comboCount = 0;
      document.getElementById('comboDisplay').textContent = 'COMBO 0';
    }, 1200);

    // Engine / Industry / Markt (simuliert)
    state.engine = (state.engine + v * 0.3) % 1000;
    state.industry = (state.industry + v * 0.2) % 1000;
    state.markt = (state.markt + v * 0.4) % 1000;
    document.getElementById('engineDisplay').textContent = Math.round(state.engine);
    document.getElementById('industryDisplay').textContent = Math.round(state.industry);
    document.getElementById('marktDisplay').textContent = Math.round(state.markt);
  }

  // ─── TON (simuliert über Web Audio) ─────────────────────────
  let audioCtx = null;

  function playTone(freq = 440, dur = 0.12) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = freq + (Math.random() * 30 - 15);
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) { /* still */ }
  }

  // ─── 6D STEP ─────────────────────────────────────────────────
  function sixDStep() {
    state.sixD = !state.sixD;
    document.getElementById('dot6d').className = 'dot ' + (state.sixD ? 'on' : '');
    log(state.sixD ? '🌀 6D aktiviert' : '🌀 6D deaktiviert', '6d');

    if (state.sixD) {
      // Welleneffekt über das Gitter
      cells.forEach((cell, idx) => {
        const delay = (idx % 27) * 2 + Math.floor(idx / 27) * 1.5;
        setTimeout(() => {
          cell.classList.add('wave');
          const scale = 1 + 0.1 * Math.sin(idx * 0.05 + state.cycle * 0.02);
          cell.style.transform = `scale(${scale})`;
        }, delay);
      });
      // nach 2 Sekunden zurücksetzen
      setTimeout(() => {
        cells.forEach(c => {
          c.classList.remove('wave');
          c.style.transform = 'scale(1)';
        });
      }, 2200);
      state.cycle++;
      updateScore(2);
    } else {
      cells.forEach(c => {
        c.classList.remove('wave');
        c.style.transform = 'scale(1)';
      });
    }
  }

  // ─── DS9 ──────────────────────────────────────────────────────
  function toggleDs9() {
    state.ds9 = !state.ds9;
    document.getElementById('dotDs9').className = 'dot ' + (state.ds9 ? 'pulse' : '');
    log(state.ds9 ? '★ DEEP SPACE NINE · aktiv' : '★ DS9 · inaktiv', 'ds9');
    if (state.ds9) {
      // Goldener Schimmer auf allen Zellen
      cells.forEach(c => {
        c.style.borderColor = 'rgba(255,215,0,0.2)';
        c.style.boxShadow = '0 0 8px rgba(255,215,0,0.05)';
      });
    } else {
      cells.forEach(c => {
        c.style.borderColor = '';
        c.style.boxShadow = '';
      });
    }
  }

  // ─── ACHSEN (toggle) ─────────────────────────────────────────
  function toggleAchsen() {
    state.achsen = state.achsen === 756 ? 756 + Math.floor(Math.random() * 100) : 756;
    document.getElementById('dotAchse').className = 'dot pulse';
    log(`📐 ACHSEN: ${state.achsen}`, 'achse');
    // Ein paar Zellen aufblitzen lassen
    for (let i = 0; i < 30; i++) {
      const idx = Math.floor(Math.random() * TOTAL);
      cells[idx].style.background = 'rgba(100,200,255,0.2)';
      setTimeout(() => cells[idx].style.background = '', 300);
    }
  }

  // ─── FLUID WAVE ──────────────────────────────────────────────
  function fluidWave() {
    state.fluid = !state.fluid;
    document.getElementById('dotFluid').className = 'dot ' + (state.fluid ? 'on' : '');
    log(state.fluid ? '💧 FLUID WAVE · aktiv' : '💧 FLUID WAVE · inaktiv', 'flow');

    if (state.fluid) {
      // Wellenanimation über das gesamte Gitter
      let step = 0;
      const interval = setInterval(() => {
        if (!state.fluid) { clearInterval(interval); return; }
        step++;
        cells.forEach((cell, idx) => {
          const x = idx % COLS;
          const y = Math.floor(idx / COLS);
          const dist = Math.sqrt((x - 13) ** 2 + (y - 14) ** 2);
          const wave = Math.sin(dist * 0.25 + step * 0.15) * 0.15 + 1;
          const scale = 1 + wave * 0.08;
          cell.style.transform = `scale(${scale})`;
          const bright = 0.2 + wave * 0.15;
          cell.style.background = `rgba(160,200,240,${bright * 0.15})`;
        });
        // alle 60ms
      }, 60);

      // nach 3 Sekunden sanft auslaufen lassen
      setTimeout(() => {
        state.fluid = false;
        document.getElementById('dotFluid').className = 'dot';
        cells.forEach(c => {
          c.style.transform = 'scale(1)';
          c.style.background = '';
        });
        clearInterval(interval);
        log('💧 FLUID WAVE · ausgelaufen', 'flow');
      }, 3000);
    }
  }

  // ─── QUAKE ────────────────────────────────────────────────────
  function doQuake() {
    log('⚡ QUAKE · alle Achsen vibrieren', 'whirl');
    cells.forEach((cell, i) => {
      const delay = Math.random() * 200;
      setTimeout(() => {
        const shakeX = (Math.random() - 0.5) * 10;
        const shakeY = (Math.random() - 0.5) * 10;
        cell.style.transform = `translate(${shakeX}px, ${shakeY}px) scale(${1 + Math.random() * 0.1})`;
        cell.style.background = `rgba(200,180,255,${0.1 + Math.random() * 0.2})`;
        setTimeout(() => {
          cell.style.transform = 'translate(0,0) scale(1)';
          cell.style.background = '';
        }, 300);
      }, delay);
    });
    updateScore(5);
    playTone(200, 0.3);
  }

  // ─── RESET ────────────────────────────────────────────────────
  function resetAll() {
    state.score = 0;
    state.engine = 0;
    state.industry = 0;
    state.markt = 0;
    state.combo = 0;
    state.fluid = false;
    state.ds9 = false;
    state.sixD = false;
    state.achsen = 756;
    state.cycle = 0;
    comboCount = 0;

    document.getElementById('scoreDisplay').textContent = '0';
    document.getElementById('engineDisplay').textContent = '0';
    document.getElementById('industryDisplay').textContent = '0';
    document.getElementById('marktDisplay').textContent = '0';
    document.getElementById('comboDisplay').textContent = 'COMBO 0';
    document.getElementById('dot6d').className = 'dot';
    document.getElementById('dotDs9').className = 'dot';
    document.getElementById('dotFluid').className = 'dot';
    document.getElementById('dotAchse').className = 'dot';

    cells.forEach(c => {
      c.style.transform = '';
      c.style.background = '';
      c.style.boxShadow = '';
      c.style.borderColor = '';
      c.classList.remove('quicksilver', 'wave');
    });

    log('⟲ RESET · Quecksilber neu formatiert', 'flow');
  }

  // ─── LOG ──────────────────────────────────────────────────────
  function log(msg, type = 'ok') {
    const el = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    const cls = ['ok','flow','whirl','ds9','achse','6d'].includes(type) ? type : 'ok';
    el.innerHTML += `<div>[${time}] <span class="${cls}">${msg}</span></div>`;
    el.scrollTop = el.scrollHeight;
    if (el.children.length > 25) el.removeChild(el.firstChild);
  }

  // ─── BUTTONS ──────────────────────────────────────────────────
  document.getElementById('btn6d').addEventListener('click', sixDStep);
  document.getElementById('btnDs9').addEventListener('click', toggleDs9);
  document.getElementById('btnAchse').addEventListener('click', toggleAchsen);
  document.getElementById('btnFluid').addEventListener('click', fluidWave);
  document.getElementById('btnQuake').addEventListener('click', doQuake);
  document.getElementById('btnReset').addEventListener('click', resetAll);

  // ─── TASTATUR ─────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); sixDStep(); }
    if (e.key === 'd' || e.key === 'D') toggleDs9();
    if (e.key === 'a' || e.key === 'A') toggleAchsen();
    if (e.key === 'f' || e.key === 'F') fluidWave();
    if (e.key === 'q' || e.key === 'Q') doQuake();
    if (e.key === 'x' || e.key === 'X') resetAll();
  });

  // ─── INIT ─────────────────────────────────────────────────────
  log('🧿 Quecksilber · 756 Achsen · 6D · flüssig', 'ds9');
  log('⌨️  space=6D  d=DS9  a=ACHSEN  f=FLUID  q=QUAKE  x=RESET', 'flow');

  // Automatischer Fluid‑Puls (dezent)
  setInterval(() => {
    if (!state.fluid && !state.sixD) {
      // ganz leichte Bewegung bei einigen Zellen
      const idx = Math.floor(Math.random() * TOTAL);
      const cell = cells[idx];
      cell.style.transform = 'scale(1.04)';
      cell.style.background = 'rgba(160,200,240,0.05)';
      setTimeout(() => {
        cell.style.transform = 'scale(1)';
        cell.style.background = '';
      }, 300);
    }
  }, 800);

  // Initialer Glanz auf einigen Zellen
  setTimeout(() => {
    for (let i = 0; i < 30; i++) {
      const idx = Math.floor(Math.random() * TOTAL);
      cells[idx].classList.add('quicksilver');
      setTimeout(() => cells[idx].classList.remove('quicksilver'), 500);
    }
  }, 500);
</script>
