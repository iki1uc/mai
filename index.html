<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNI‑9 · A81‑AXIS · iki1uc</title>

  <style>
    body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
    h1 { color:#6cf; }
    canvas { background:#111; border:1px solid #333; margin-top:20px; display:block; }
    .console { background:#111; border:1px solid #444; padding:10px; white-space:pre-wrap; }
    button { background:#222; color:#0f0; border:1px solid #0f0; padding:6px 14px; margin:4px; }
    button:hover { background:#0f0; color:#000; }
  </style>
</head>

<body>

<h1>UNI‑9 · A81‑AXIS · iki1uc</h1>

<div class="console" id="engineOut">UNI‑9 Engine lädt…</div>
<canvas id="orbitCanvas" width="500" height="500"></canvas>

<button id="btnUni9">⚡ UNI‑9 START</button>
<button id="btnA81">🔺 A81‑AXIS BOOST</button>

<script type="module">

// MODULE IMPORTS
import { KIT } from "./kit.js";
import { resetKernel } from "./resetKernel.js";
import { QUANT } from "./QUANT.js";
import { SYN } from "./SYN.js";
import { QUO } from "./QUO.js";
import { PYRAMIDE } from "./PYRAMIDE.js";

// STATE — 8 → 9 → 81
const STATE = {
  achsen: 8,
  uni9: false,
  a81: false,
  mode: "INIT",
  arg: { sync:false }
};

// AXIS
const AXIS = {
  base: () => STATE.achsen,
  x: () => STATE.achsen * 9,
  y: () => STATE.achsen * 9,
  z: () => STATE.achsen * 9
};

// CANVAS
const canvas = document.getElementById("orbitCanvas");
const ctx = canvas.getContext("2d");
let t = 0;

// RENDER
function render() {
  t += 0.01;
  ctx.clearRect(0,0,500,500);

  const cx = 250 + Math.sin(t) * AXIS.x();
  const cy = 250 + Math.cos(t) * AXIS.y();

  ctx.fillStyle = "#0f0";
  ctx.beginPath();
  ctx.arc(cx, cy, AXIS.z()*0.1 + 10, 0, Math.PI*2);
  ctx.fill();

  document.getElementById("engineOut").innerText =
    "MODE: " + STATE.mode + "\n" +
    "ACHSEN: " + STATE.achsen + "\n" +
    "UNI‑9: " + STATE.uni9 + "\n" +
    "A81: " + STATE.a81;
  
  requestAnimationFrame(render);
}

// BUTTON: UNI‑9
document.getElementById("btnUni9").addEventListener("click", () => {
  STATE.achsen = 9;
  STATE.uni9 = true;
  STATE.mode = "UNI‑9";
});

// BUTTON: A81‑AXIS
document.getElementById("btnA81").addEventListener("click", () => {
  STATE.achsen = 81;
  STATE.a81 = true;
  STATE.mode = "A81‑AXIS";
});

// START
render();

</script>
</body>
</html>
