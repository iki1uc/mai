<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNI · 9‑Achsen · A81‑Axis · iki1uc · PFAD‑LOGIK</title>

  <style>
    body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
    h1 { color:#6cf; }
    canvas { background:#111; border:1px solid #333; margin-top:20px; display:block; }
    .console { background:#111; border:1px solid #444; padding:10px; white-space:pre-wrap; }
    button { background:#222; color:#0f0; border:1px solid #0f0; padding:6px 14px; margin:4px; cursor:pointer; }
    button:hover { background:#0f0; color:#000; }
    .energy { height:10px; background:#222; margin-top:10px; }
    .energy-fill { height:10px; background:#0f0; width:0%; transition:0.2s; }
  </style>
</head>

<body>

<h1>OMNI · 9‑Achsen · A81‑Axis · PFAD‑LOGIK</h1>

<div class="console" id="engineOut">OMNI Engine lädt…</div>
<div class="energy"><div id="energyFill" class="energy-fill"></div></div>

<canvas id="orbitCanvas" width="500" height="500"></canvas>

<button id="btnStep">▶ STEP</button>
<button id="btnLoop">🔁 LOOP</button>
<button id="btnStop">⏹ STOP</button>
<button id="btnOMNI">🧠 OMNI</button>
<button id="btnReset">⟲ RESET</button>

<script>
// ============================================================
// PFAD – die einzige Wahrheit: 81 → 9 → 3 → 9 → 81 → …
// ============================================================
const PFAD = [81, 9, 3, 9, 81];
let pfadIndex = 0;

// ============================================================
// STATE
// ============================================================
const STATE = {
  achsen: PFAD[pfadIndex],
  mode: "PFAD",
  omni: false,
  loop: false,
  energy: 0,
  gear: 0,
  a81: (PFAD[pfadIndex] === 81)
};

// ============================================================
// AXIS – skaliert nach aktuellem PFAD-Wert
// ============================================================
const AXIS = {
  base: () => STATE.achsen,
  x: () => STATE.achsen * 9,
  y: () => STATE.achsen * 9,
  z: () => STATE.achsen * 9
};

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById("orbitCanvas");
const ctx = canvas.getContext("2d");
let t = 0;

// ============================================================
// STEP – PFAD vorwärts bewegen
// ============================================================
function step() {
  // Energie steigt
  STATE.energy = Math.min(100, STATE.energy + 5);

  // Zahnrad zählt hoch (0–11)
  STATE.gear = (STATE.gear + 1) % 12;

  // PFAD-Schritt
  pfadIndex = (pfadIndex + 1) % PFAD.length;
  STATE.achsen = PFAD[pfadIndex];
  STATE.a81 = (STATE.achsen === 81);

  // Modus basierend auf PFAD-Wert
  if (STATE.achsen === 81) STATE.mode = "A81";
  else if (STATE.achsen === 9) STATE.mode = "UNI‑9";
  else if (STATE.achsen === 3) STATE.mode = "UR‑3";
  else STATE.mode = "PFAD";

  // OMNI-Sonderfall: wenn Zahnrad 10, dann OMNI-Modus (zeigt extra Glow)
  if (STATE.gear === 10) {
    STATE.omni = true;
    STATE.mode = "OMNI";
  } else {
    STATE.omni = false;
  }

  // Energie-Balken aktualisieren
  document.getElementById("energyFill").style.width = STATE.energy + "%";

  // Konsole aktualisieren
  document.getElementById("engineOut").innerText =
    "MODE: " + STATE.mode + "\n" +
    "ACHSEN: " + STATE.achsen + "\n" +
    "PFAD-INDEX: " + pfadIndex + "\n" +
    "GEAR: " + STATE.gear + "\n" +
    "OMNI: " + STATE.omni + "\n" +
    "A81: " + STATE.a81 + "\n" +
    "ENERGIE: " + STATE.energy + "%";

  render();
}

// ============================================================
// RENDER – Orbit + Achsen + Pfad + Energie
// ============================================================
function render() {
  t += 0.01;
  ctx.clearRect(0,0,500,500);

  const cx = 250 + Math.sin(t) * AXIS.x();
  const cy = 250 + Math.cos(t) * AXIS.y();
  const radius = AXIS.z() * 0.1 + 10;

  // Orbit-Punkt
  ctx.fillStyle = STATE.omni ? "#f0f" : "#0f0";
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI*2);
  ctx.fill();

  // A81-Marker (wenn aktueller Wert 81)
  if (STATE.a81) {
    const px = 250 + Math.sin(t*2) * 81;
    const py = 250 + Math.cos(t*2) * 81;
    ctx.fillStyle = "#ff0";
    ctx.beginPath();
    ctx.arc(px, py, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#ff0";
    ctx.font = "12px Consolas";
    ctx.fillText("81", px + 10, py + 4);
  }

  // 3-Marker (wenn aktueller Wert 3)
  if (STATE.achsen === 3) {
    const px = 250 + Math.sin(t*2 + 1) * 3;
    const py = 250 + Math.cos(t*2 + 1) * 3;
    ctx.fillStyle = "#0ff";
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#0ff";
    ctx.font = "12px Consolas";
    ctx.fillText("3", px + 10, py + 4);
  }
}

// ============================================================
// LOOP
// ============================================================
let loopTimer = null;

function startLoop() {
  if (!loopTimer) {
    loopTimer = setInterval(step, 500);
    STATE.loop = true;
  }
}

function stopLoop() {
  clearInterval(loopTimer);
  loopTimer = null;
  STATE.loop = false;
}

// ============================================================
// BUTTONS
// ============================================================
document.getElementById("btnStep").addEventListener("click", step);
document.getElementById("btnLoop").addEventListener("click", startLoop);
document.getElementById("btnStop").addEventListener("click", stopLoop);

document.getElementById("btnOMNI").addEventListener("click", () => {
  STATE.omni = true;
  STATE.mode = "OMNI";
  STATE.gear = 10;
});

document.getElementById("btnReset").addEventListener("click", () => {
  pfadIndex = 0;
  STATE.achsen = PFAD[pfadIndex];
  STATE.mode = "PFAD";
  STATE.omni = false;
  STATE.a81 = (STATE.achsen === 81);
  STATE.energy = 0;
  STATE.gear = 0;
  render();
});

// ============================================================
// START
// ============================================================
render();
</script>

</body>
</html>
